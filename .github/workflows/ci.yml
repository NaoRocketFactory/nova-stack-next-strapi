name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PNPM_VERSION: "11.5.0"
  NODE_VERSION: "22"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Placeholder, non-secret values — matches backend/.env.example.
    # Strapi's config loader requires these to be set to boot at all,
    # even for `strapi build`, which never talks to a real database.
    env:
      APP_KEYS: ciKey1,ciKey2,ciKey3,ciKey4
      API_TOKEN_SALT: ciApiTokenSalt
      ADMIN_JWT_SECRET: ciAdminJwtSecret
      ADMIN_AUTH_SECRET: ciAdminAuthSecret
      TRANSFER_TOKEN_SALT: ciTransferTokenSalt
      JWT_SECRET: ciJwtSecret
      ENCRYPTION_KEY: ciEncryptionKey
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
